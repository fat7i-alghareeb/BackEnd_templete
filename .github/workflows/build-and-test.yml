name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore Taxi_Server.slnx

    # Warnings are errors in CI: StyleCop findings and NuGet audit (NU19xx) warnings fail the build.
    - name: Build solution
      run: dotnet build Taxi_Server.slnx --configuration Release --no-restore -warnaserror

    # `dotnet list package --vulnerable` exits 0 even when it finds something, so check its output.
    - name: Check for vulnerable packages
      run: |
        dotnet list Taxi_Server.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
        if grep -q "has the following vulnerable packages" vulnerable.txt; then
          echo "::error::Vulnerable NuGet packages found (see the list above)."
          exit 1
        fi

    # The integration suite starts PostgreSQL with Testcontainers; ubuntu-latest has Docker.
    - name: Run tests with coverage
      run: >
        dotnet test Taxi_Server.slnx
        --configuration Release
        --no-build
        --settings coverlet.runsettings
        --collect:"XPlat Code Coverage"
        --results-directory ./coverage
        --logger "trx;LogFilePrefix=results"

    - name: Build coverage report
      if: always()
      uses: danielpalme/ReportGenerator-GitHub-Action@5
      with:
        reports: coverage/**/coverage.cobertura.xml
        targetdir: coverage/report
        reporttypes: HtmlInline;MarkdownSummaryGithub;Cobertura

    - name: Publish coverage summary
      if: always()
      run: |
        if [ -f coverage/report/SummaryGithub.md ]; then
          cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload coverage and test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-and-test-results
        path: |
          coverage/report
          coverage/**/*.trx

  # The API image must keep building: restore, publish, non-root runtime, HEALTHCHECK.
  docker-image:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Build the API image
      run: docker build --file src/Taxi.Api/Dockerfile --tag taxi-api:ci .

  # Docs are part of the template; keep them lint-clean (.markdownlint-cli2.jsonc).
  markdown-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Lint Markdown
      uses: DavidAnson/markdownlint-cli2-action@v20
