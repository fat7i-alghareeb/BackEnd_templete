<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="t">
  <title id="t">Template at a glance: 6 projects, 5 pipeline stages, 2 languages, 17-step feature recipe, 5 containers, 7 error kinds</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#1A1240"/>
    </linearGradient>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; text-anchor: middle; }
      .n { font-size: 38px; font-weight: 800; }
      .l { font-size: 13px; fill: #94A3B8; font-weight: 600; letter-spacing: .4px; }
    </style>
  </defs>
  <rect width="1200" height="150" rx="20" fill="url(#bg)"/>
  <g transform="translate(0 0)">
    <rect x="16" y="18" width="178" height="114" rx="14" fill="#0F172A" stroke="#7C3AED" stroke-opacity=".7"/>
    <text x="105" y="76" class="n" fill="#C4B5FD">6</text>
    <text x="105" y="108" class="l">PROJECTS</text>

    <rect x="212" y="18" width="178" height="114" rx="14" fill="#0F172A" stroke="#F43F5E" stroke-opacity=".7"/>
    <text x="301" y="76" class="n" fill="#FDA4AF">5</text>
    <text x="301" y="108" class="l">PIPELINE STAGES</text>

    <rect x="408" y="18" width="178" height="114" rx="14" fill="#0F172A" stroke="#F59E0B" stroke-opacity=".7"/>
    <text x="497" y="76" class="n" fill="#FCD34D">2</text>
    <text x="497" y="108" class="l">LANGUAGES · EN / AR</text>

    <rect x="604" y="18" width="178" height="114" rx="14" fill="#0F172A" stroke="#2DD4BF" stroke-opacity=".7"/>
    <text x="693" y="76" class="n" fill="#5EEAD4">17</text>
    <text x="693" y="108" class="l">STEP FEATURE RECIPE</text>

    <rect x="800" y="18" width="178" height="114" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-opacity=".7"/>
    <text x="889" y="76" class="n" fill="#7DD3FC">5</text>
    <text x="889" y="108" class="l">DOCKER SERVICES</text>

    <rect x="996" y="18" width="188" height="114" rx="14" fill="#0F172A" stroke="#34D399" stroke-opacity=".7"/>
    <text x="1090" y="76" class="n" fill="#6EE7B7">7</text>
    <text x="1090" y="108" class="l">ERROR KINDS → HTTP</text>
  </g>
