<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Backend Template</title>
  <desc id="d">Production-ready ASP.NET Core starter built on .NET 10 with Clean Architecture and CQRS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#15103A"/>
      <stop offset="1" stop-color="#1E0F4D"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <radialGradient id="glowP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowT" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <style>
      .spin { transform-origin: 1030px 200px; animation: spin 40s linear infinite; }
      .spin-rev { transform-origin: 1030px 200px; animation: spin 60s linear infinite reverse; }
      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      text { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    </style>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <circle cx="1030" cy="200" r="260" fill="url(#glowP)"/>
  <circle cx="120" cy="380" r="220" fill="url(#glowT)"/>

  <!-- left: copy -->
  <g transform="translate(72 0)">
    <rect x="0" y="62" width="244" height="34" rx="17" fill="#512BD4" fill-opacity="0.25" stroke="#8B5CF6" stroke-opacity="0.6"/>
    <circle cx="20" cy="79" r="5" fill="#2DD4BF" class="pulse"/>
    <text x="34" y="85" font-size="15" font-weight="600" fill="#E9D5FF" letter-spacing="0.5">.NET 10  ·  ASP.NET Core</text>

    <text x="0" y="170" font-size="68" font-weight="800" fill="url(#title)" letter-spacing="-1.5">Backend Template</text>
    <text x="2" y="214" font-size="26" font-weight="500" fill="#C4B5FD">Production-ready ASP.NET Core starter</text>
    <text x="2" y="252" font-size="17" fill="#94A3B8">Clone it, rename it, ship features. The plumbing is already done.</text>

    <!-- chips -->
    <g font-size="14" font-weight="600">
      <rect x="0" y="286" width="170" height="36" rx="10" fill="#0F172A" stroke="#8B5CF6" stroke-opacity="0.55"/>
      <text x="85" y="309" text-anchor="middle" fill="#DDD6FE">Clean Architecture</text>

      <rect x="182" y="286" width="84" height="36" rx="10" fill="#0F172A" stroke="#8B5CF6" stroke-opacity="0.55"/>
      <text x="224" y="309" text-anchor="middle" fill="#DDD6FE">CQRS</text>

      <rect x="278" y="286" width="140" height="36" rx="10" fill="#0F172A" stroke="#2DD4BF" stroke-opacity="0.55"/>
      <text x="348" y="309" text-anchor="middle" fill="#99F6E4">JWT + RBAC</text>

      <rect x="430" y="286" width="118" height="36" rx="10" fill="#0F172A" stroke="#2DD4BF" stroke-opacity="0.55"/>
      <text x="489" y="309" text-anchor="middle" fill="#99F6E4">PostgreSQL</text>

      <rect x="560" y="286" width="104" height="36" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-opacity="0.6"/>
      <text x="612" y="309" text-anchor="middle" fill="#FDE68A">EN · عربي</text>

      <rect x="676" y="286" width="96" height="36" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-opacity="0.6"/>
      <text x="724" y="309" text-anchor="middle" fill="#FDE68A">Docker</text>
    </g>

    <text x="2" y="358" class="mono" font-size="14" fill="#64748B">$ docker compose up -d  &amp;&amp;  dotnet run --project src/Taxi.Api</text>
  </g>

  <!-- right: onion -->
  <g>
    <circle cx="1030" cy="200" r="168" fill="none" stroke="#8B5CF6" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 10" class="spin"/>
    <circle cx="1030" cy="200" r="150" fill="#1E1B4B" fill-opacity="0.75" stroke="#6366F1" stroke-opacity="0.7" stroke-width="2"/>
    <circle cx="1030" cy="200" r="112" fill="#2E1065" fill-opacity="0.85" stroke="#8B5CF6" stroke-width="2"/>
    <circle cx="1030" cy="200" r="74" fill="#4C1D95" stroke="#A78BFA" stroke-width="2"/>
    <circle cx="1030" cy="200" r="38" fill="#7C3AED" stroke="#DDD6FE" stroke-width="2"/>
    <circle cx="1030" cy="200" r="186" fill="none" stroke="#2DD4BF" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="1 7" class="spin-rev"/>

    <g font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">
      <text x="1030" y="205" fill="#FFFFFF">DOMAIN</text>
      <text x="1030" y="156" fill="#E9D5FF" font-size="11" letter-spacing="1">APPLICATION</text>
      <text x="1030" y="117" fill="#C4B5FD" font-size="11" letter-spacing="1">INFRASTRUCTURE</text>
      <text x="1030" y="78" fill="#A5B4FC">API</text>
    </g>

    <!-- orbit dots -->
    <g class="spin">
      <circle cx="1030" cy="32" r="6" fill="#2DD4BF"/>
      <circle cx="1198" cy="200" r="5" fill="#F59E0B"/>
      <circle cx="862" cy="200" r="5" fill="#F472B6"/>
    </g>
  </g>
</svg>
