services:
  # One-shot init: fix ownership of the api-storage named volume so the non-root
  # app user ($APP_UID = 1654 in the .NET image) can write uploaded files
  # (FileStorage:LocalRootPath = /app/storage). A persisted named volume keeps its
  # own root:root ownership, so the Dockerfile's build-time chown never reaches
  # it — this heals the volume on every `up`.
  taxi.api-init:
    image: busybox:1.36
    command: sh -c "mkdir -p /app/storage && chown -R 1654:1654 /app/storage"
    user: "0:0"
    volumes:
      - api-storage:/app/storage
    restart: "no"

  taxi.api:
    depends_on:
      taxi.api-init:
        condition: service_completed_successfully
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=TaxiDb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      JwtSettings__Secret: ${JWT_SECRET}
      Email__Provider: Smtp
      Email__FromAddress: ${EMAIL_FROM_ADDRESS}
      Email__Smtp__Host: ${SMTP_HOST}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__Username: ${SMTP_USERNAME}
      Email__Smtp__Password: ${SMTP_PASSWORD}
      # Optional bootstrap Manager account. Leave unset to seed no user.
      Seed__Admin__Email: ${SEED_ADMIN_EMAIL:-}
      Seed__Admin__Password: ${SEED_ADMIN_PASSWORD:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://seq:5341/ingest/otlp/v1/traces
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    volumes:
      - api-storage:/app/storage
    restart: always

  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: TaxiDb
    restart: always

  redis:
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: always

  seq:
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_NOAUTHENTICATION: "false"
    restart: always

  prometheus:
    restart: always

  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    restart: always

volumes:
  api-storage:
