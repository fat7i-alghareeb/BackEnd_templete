services:
  # One-shot init: fix ownership of the api-wwwroot named volume so the non-root
  # app user ($APP_UID = 1654 in the .NET image) can create runtime upload
  # sub-dirs. A persisted named volume keeps its own root:root ownership and
  # overlays the image's wwwroot, so the Dockerfile's build-time chmod never
  # reaches it — this heals the volume on every `up`.
  taxi.api-init:
    image: busybox:1.36
    command: sh -c "mkdir -p /app/wwwroot && chown -R 1654:1654 /app/wwwroot"
    user: "0:0"
    volumes:
      - api-wwwroot:/app/wwwroot
    restart: "no"

  taxi.api:
    depends_on:
      taxi.api-init:
        condition: service_completed_successfully
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=TaxiDb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      JwtSettings__Secret: ${JWT_SECRET}
      # Optional bootstrap Manager account. Leave unset to seed no user.
      Seed__Admin__Email: ${SEED_ADMIN_EMAIL:-}
      Seed__Admin__Password: ${SEED_ADMIN_PASSWORD:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://seq:5341/ingest/otlp/v1/traces
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    volumes:
      - api-wwwroot:/app/wwwroot
    restart: always

  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: TaxiDb
    restart: always

  redis:
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: always

  seq:
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_NOAUTHENTICATION: "false"
    restart: always

  prometheus:
    restart: always

  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    restart: always

volumes:
  api-wwwroot:
