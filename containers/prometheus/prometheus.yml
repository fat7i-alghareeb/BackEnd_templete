global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'taxi-api'
    metrics_path: /metrics
    static_configs:
      # The image listens on 8080 (ASPNETCORE_HTTP_PORTS default) in every environment.
      - targets: ['taxi.api:8080']
  
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
