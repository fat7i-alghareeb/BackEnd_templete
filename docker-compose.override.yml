services:
  taxi.api:
    ports:
      - "5001:80"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=TaxiDb;Username=postgres;Password=YourStrong@Password1
      ConnectionStrings__Redis: redis:6379
      # Dev mail goes to Mailpit: open http://localhost:8025 to read confirmation / reset emails.
      Email__Provider: Smtp
      Email__Smtp__Host: mailpit
      Email__Smtp__Port: "1025"
      Email__Smtp__Security: None
      OTEL_EXPORTER_OTLP_ENDPOINT: http://seq:5341/ingest/otlp/v1/traces
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      # appsettings.Development.json points the Seq sink at localhost for `dotnet run`;
      # inside compose it must reach the container by service name.
      Serilog__WriteTo__2__Args__serverUrl: http://seq:5341
    restart: on-failure

  postgres:
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: YourStrong@Password1
      POSTGRES_DB: TaxiDb
    ports:
      - "5433:5432"
    restart: always

  redis:
    ports:
      - "6379:6379"
    restart: always

  # Development-only SMTP sink with a web inbox.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  seq:
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:5341"
      - "8081:80"
    restart: unless-stopped

  prometheus:
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: YourStrongPwd
    ports:
      - "3000:3000"
    restart: unless-stopped
