services:
  taxi.api:
    build:
      context: .
      dockerfile: src/Taxi.Api/Dockerfile
      target: final
    depends_on:
      - postgres
      - seq

  postgres:
    image: postgres:16
    volumes:
      - postgres-data:/var/lib/postgresql/data

  seq:
    image: datalust/seq:latest
    volumes:
      - ./containers/seq:/data

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./containers/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - taxi.api

  grafana:
    image: grafana/grafana:latest
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres-data:
  grafana-data:
