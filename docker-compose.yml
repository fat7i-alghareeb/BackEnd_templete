services:
  # Listens on 8080 inside the container. The image's HEALTHCHECK probes /health/live;
  # `docker compose ps` shows the result.
  taxi.api:
    build:
      context: .
      dockerfile: src/Taxi.Api/Dockerfile
      target: final
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seq:
        condition: service_started

  postgres:
    image: postgres:16
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # HybridCache L2: shared cache entries and tag invalidations across API instances.
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  seq:
    image: datalust/seq:latest
    volumes:
      - ./containers/seq:/data

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./containers/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      taxi.api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres-data:
  grafana-data:
